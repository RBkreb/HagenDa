# HagenDa S1 training config (1v1 Assault vs target, ML-TRAINING.md sec.8 M2)
# Behavior: HagenDaSquad - 694-dim obs, hybrid actions (6 cont + discrete 4/2/2/2/2/6)
# Phase: S1 - basic combat learning (damage/kill/death rewards only)
behaviors:
  HagenDaSquad:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1536
      buffer_size: 15360
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1.0e5
    time_horizon: 64
    summary_freq: 5000
    keep_checkpoints: 10
    checkpoint_interval: 50000
    threaded: true
