# HagenDa ML training config (ML-TRAINING.md sec.6 phase-A smoke / S1 start)
# Behavior: HagenDaSquad - 694-dim vector obs, hybrid actions (6 continuous + discrete 4/2/2/2/2/6), shared policy
behaviors:
  HagenDaSquad:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024          # Q25: tune after trial runs
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3              # entropy regularization (exploration)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      memory:
        sequence_length: 64     # Q20: LSTM seq 64
        memory_size: 128        # Q20: LSTM 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5.0e5            # smoke value; S1 target steps decided after Q25 trial
    time_horizon: 64
    summary_freq: 5000
    threaded: true
